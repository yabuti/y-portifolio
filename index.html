
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yeabsira Terefe | Social Media Marketer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#1a1a1a;--dark2:#222;--dark3:#2d2d2d;
  --cream:#f5f0e8;--cream2:#faf7f2;
  --gold:#c9a84c;--gold-l:#e2c97e;--gold-d:#a07830;
  --tl:#f0ece4;--tm:#a09880;--td:#1a1a1a;
  font-family:'Inter',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--tl);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(26,26,26,.97);border-bottom:1px solid rgba(201,168,76,.15);transition:box-shadow .3s}
.nav.scrolled{box-shadow:0 4px 30px rgba(0,0,0,.5)}
.nav-brand{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);font-weight:700}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-size:.82rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--gold)}
.nav-links a.active{position:relative}
.nav-links a.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--gold);border-radius:1px}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.nav-toggle span{display:block;width:24px;height:2px;background:var(--gold);border-radius:2px;transition:all .3s}

/* HERO */
.hero{min-height:100vh;background:var(--dark);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:6rem 2rem 4rem}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 70% 40%,rgba(201,168,76,.08) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 20% 80%,rgba(201,168,76,.05) 0%,transparent 60%);pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.cursor-glow{position:fixed;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.07) 0%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:1;transition:left .08s,top .08s}
@media(hover:none){.cursor-glow{display:none}}
.hero-content{position:relative;z-index:2;max-width:1060px;width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:3rem;align-items:center}

/* PROFILE PHOTO */
.hero-photo-wrap{display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.hero-photo-ring{position:relative;width:240px;height:240px;flex-shrink:0}
.hero-photo-ring::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--gold),var(--gold-l),var(--gold-d),var(--gold));animation:spinRing 6s linear infinite;z-index:0;will-change:transform;transform:translateZ(0)}
.hero-photo-ring::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.18) 0%,transparent 70%);animation:glowPulse 2.5s ease-in-out infinite;z-index:0;will-change:opacity,transform}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.hero-photo{width:240px;height:240px;border-radius:50%;object-fit:cover;object-position:top center;position:relative;z-index:1;border:4px solid var(--dark);display:block}
.hero-photo-badge{background:var(--gold);color:var(--dark);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.35rem 1rem;border-radius:999px;box-shadow:0 4px 16px rgba(201,168,76,.4);animation:badgePop .6s .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes badgePop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

/* MOBILE: kill expensive animations on hero */
@media(hover:none),(max-width:768px){
  .hero-photo-ring::before{
    animation:none;
    background:var(--gold);
  }
  .hero-photo-ring::after{
    animation:none;
    opacity:.5;
  }
  .hero-card{animation:none !important;}
  .svc-icon{animation:none !important;}
}
.hero-eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem;min-height:1.4em}
.typed-text{color:var(--gold)}
.cursor-blink{display:inline-block;color:var(--gold);animation:blink .9s step-end infinite;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.hero-name{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,5vw,4.4rem);font-weight:800;line-height:1.05;color:var(--tl);margin-bottom:.5rem}
.hero-name span{color:var(--gold)}
.hero-title{font-size:1rem;color:var(--tm);margin-bottom:1.2rem}
.hero-desc{font-size:.93rem;color:#7a7060;line-height:1.85;margin-bottom:2rem;max-width:420px}
.hero-actions{display:flex;flex-wrap:wrap;gap:1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.8rem;border-radius:4px;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:none;transition:all .25s}
.btn-gold{background:var(--gold);color:var(--dark);position:relative;overflow:visible}
.btn-gold::after{content:'';position:absolute;inset:0;border-radius:4px;background:var(--gold);animation:pulse-ring 2.2s ease-out infinite;z-index:-1}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.btn-gold:hover{background:var(--gold-l);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,168,76,.35)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid rgba(201,168,76,.4)}
.btn-outline:hover{border-color:var(--gold);background:rgba(201,168,76,.08);transform:translateY(-2px)}
.hero-card{background:var(--dark3);border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:2.2rem;position:relative;overflow:hidden;animation:heroFloat 4s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l))}
.hero-card-label{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem}
.hero-stat{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hero-stat:last-child{border-bottom:none}
.hero-stat-icon{width:36px;height:36px;border-radius:8px;background:rgba(201,168,76,.1);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.hero-stat:hover .hero-stat-icon{transform:scale(1.3) rotate(-8deg)}
.hero-stat-text strong{display:block;font-size:.88rem;font-weight:600;color:var(--tl)}
.hero-stat-text span{font-size:.76rem;color:var(--tm)}
.scroll-ind{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:2;animation:fadeInUp 1s 1.5s both}
.scroll-ind span{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--tm)}
.scroll-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:scrollBounce 1.4s ease-in-out infinite}
@keyframes scrollBounce{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(10px);opacity:.3}}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* SECTIONS */
.section{padding:5.5rem 2rem}
.section-dark{background:var(--dark)}
.section-dark2{background:var(--dark2)}
.section-cream{background:var(--cream);color:var(--td)}
.section-cream2{background:var(--cream2);color:var(--td)}
.container{max-width:1080px;margin:0 auto}
.section-tag{display:inline-flex;align-items:center;gap:.6rem;font-size:.73rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
.section-tag::before{content:'';display:block;width:22px;height:1px;background:var(--gold)}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,3.5vw,2.9rem);font-weight:700;line-height:1.1;margin-bottom:.8rem}
.title-dark{color:var(--tl)}.title-light{color:var(--td)}
.section-sub{font-size:.95rem;line-height:1.8;max-width:540px}
.sub-dark{color:var(--tm)}.sub-light{color:#5a5040}
.gold-div{width:60px;height:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:2px;margin:1rem 0 2rem;transform-origin:left}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:280px 1fr 1fr;gap:3rem;align-items:start;margin-top:2.5rem}
.about-photo-col{display:flex;flex-direction:column;align-items:center;gap:1rem;position:sticky;top:100px}
.about-photo{width:240px;height:280px;border-radius:16px;object-fit:cover;object-position:top center;border:3px solid rgba(201,168,76,.25);box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .3s}
.about-photo:hover{transform:scale(1.02)}
.about-photo-name{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--tl);font-weight:700}
.about-photo-role{font-size:.78rem;color:var(--gold);font-weight:600;letter-spacing:.08em}
.about-text p{font-size:.95rem;line-height:1.9;color:var(--tm);margin-bottom:1.1rem}
.about-hl{background:rgba(201,168,76,.08);border-left:3px solid var(--gold);padding:1.1rem 1.4rem;border-radius:0 8px 8px 0;margin-top:1.2rem}
.about-hl p{font-size:.93rem;color:var(--tl)!important;font-style:italic;margin:0!important}
.about-badges{display:flex;flex-direction:column;gap:.9rem}
.about-badge{background:var(--dark3);border:1px solid rgba(201,168,76,.12);border-radius:12px;padding:1.2rem 1.4rem;display:flex;align-items:flex-start;gap:.9rem;transition:border-color .2s,transform .2s}
.about-badge:hover{border-color:rgba(201,168,76,.35);transform:translateX(4px)}
.badge-icon{font-size:1.5rem;flex-shrink:0;margin-top:2px}
.about-badge h4{font-size:.88rem;font-weight:600;color:var(--tl);margin-bottom:.25rem}
.about-badge p{font-size:.8rem;color:var(--tm);line-height:1.5}

/* EDUCATION */
.edu-card{background:var(--dark3);border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:2.4rem;margin-top:2.5rem;position:relative;overflow:hidden}
.edu-card::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(201,168,76,.04),transparent);animation:shimmer 3.5s ease-in-out infinite}
@keyframes shimmer{0%{left:-100%}100%{left:160%}}
.edu-card::after{content:'🎓';position:absolute;right:2rem;top:2rem;font-size:3rem;opacity:.07}
.edu-year{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);font-size:.76rem;font-weight:700;letter-spacing:.1em;padding:.28rem .85rem;border-radius:999px;margin-bottom:.9rem}
.edu-card h3{font-family:'Playfair Display',serif;font-size:1.45rem;color:var(--tl);margin-bottom:.4rem}
.edu-src{font-size:.86rem;color:var(--gold);font-weight:600;margin-bottom:1.1rem}
.edu-card p{font-size:.91rem;color:var(--tm);line-height:1.8;margin-bottom:.9rem}
.edu-tags{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.3rem}
.edu-tag{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--gold-l);font-size:.76rem;font-weight:500;padding:.3rem .85rem;border-radius:999px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .4s}

/* SKILLS */
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.skills-group-title{font-size:.76rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-d);margin-bottom:1.8rem;display:flex;align-items:center;gap:.6rem}
.skills-group-title::after{content:'';flex:1;height:1px;background:rgba(160,120,48,.2)}
.circles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.circle-skill{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.circle-wrap{position:relative;width:88px;height:88px}
.circle-wrap svg{transform:rotate(-90deg);width:88px;height:88px}
.c-bg{fill:none;stroke:rgba(160,120,48,.15);stroke-width:7}
.c-fill{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--gold-d)}
.circle-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;color:var(--td)}
.circle-label{font-size:.72rem;font-weight:600;color:#5a5040;text-align:center;line-height:1.3}
.bar-skill{margin-bottom:1.3rem}
.bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}
.bar-name{font-size:.86rem;font-weight:600;color:var(--td)}
.bar-pct{font-size:.8rem;font-weight:700;color:var(--gold-d)}
.bar-track{height:8px;background:rgba(160,120,48,.12);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold-d),var(--gold))}

/* SERVICES */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2.5rem}
.svc-card{background:var(--dark3);border:1px solid rgba(201,168,76,.1);border-radius:16px;padding:1.9rem 1.7rem;transition:border-color .25s,transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.svc-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .3s}
.svc-card:hover{border-color:rgba(201,168,76,.35);transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.svc-card:hover::after{opacity:1}
.svc-icon{font-size:2.1rem;margin-bottom:1.1rem;display:block;animation:iconFloat 3s ease-in-out infinite}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.svc-card:nth-child(1) .svc-icon{animation-delay:0s}
.svc-card:nth-child(2) .svc-icon{animation-delay:.4s}
.svc-card:nth-child(3) .svc-icon{animation-delay:.8s}
.svc-card:nth-child(4) .svc-icon{animation-delay:.2s}
.svc-card:nth-child(5) .svc-icon{animation-delay:.6s}
.svc-card:nth-child(6) .svc-icon{animation-delay:1s}
.svc-card h3{font-size:.97rem;font-weight:700;color:var(--tl);margin-bottom:.55rem}
.svc-card p{font-size:.83rem;color:var(--tm);line-height:1.7}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;align-items:start;margin-top:2.5rem}
.contact-list{display:flex;flex-direction:column;gap:1.1rem}
.contact-item{display:flex;align-items:flex-start;gap:.9rem;padding:1.1rem 1.3rem;background:#fff;border-radius:12px;border:1px solid rgba(160,120,48,.12);box-shadow:0 2px 12px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s}
.contact-item:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.contact-icon{width:40px;height:40px;border-radius:10px;background:rgba(160,120,48,.1);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.contact-body strong{display:block;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);margin-bottom:.15rem}
.contact-body span{font-size:.88rem;color:#3a3020;font-weight:500}
.contact-cta{background:var(--dark);border-radius:18px;padding:2.3rem;color:var(--tl);position:relative;overflow:hidden}
.contact-cta::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l))}
.contact-cta h3{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--tl);margin-bottom:.7rem}
.contact-cta p{font-size:.88rem;color:var(--tm);line-height:1.7;margin-bottom:1.6rem}
.cta-links{display:flex;flex-direction:column;gap:.75rem}
.cta-link{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.1rem;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.15);border-radius:10px;font-size:.86rem;color:var(--tl);font-weight:500;transition:background .2s,border-color .2s;cursor:pointer}
.cta-link:hover{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.35)}

/* FOOTER */
.footer{background:#111;border-top:1px solid rgba(201,168,76,.1);padding:2.3rem 2rem;text-align:center}
.footer-name{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--gold);margin-bottom:.35rem}
.footer-sub{font-size:.8rem;color:var(--tm);margin-bottom:1.1rem}
.footer-links{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap}
.footer-links a{font-size:.78rem;color:var(--tm);transition:color .2s}
.footer-links a:hover{color:var(--gold)}
.footer-copy{margin-top:1.3rem;font-size:.72rem;color:#444}

/* ANIMATIONS */
.fade-up{opacity:0;transform:translateY(18px);transition:opacity .35s ease,transform .35s ease}
.fade-up.in{opacity:1;transform:translateY(0)}
.fade-left{opacity:0;transform:translateX(20px);transition:opacity .35s ease,transform .35s ease}
.fade-left.in{opacity:1;transform:translateX(0)}
.tag-pop{opacity:0;transform:scale(.85);transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1)}
.tag-pop.in{opacity:1;transform:scale(1)}

/* RESPONSIVE */
@media(max-width:900px){
  .hero-content{grid-template-columns:1fr;gap:2rem;text-align:center}
  .hero-photo-wrap{order:-1}
  .hero-desc{max-width:100%}
  .hero-actions{justify-content:center}
  .about-grid{grid-template-columns:1fr;gap:2.2rem}
  .about-photo-col{position:static}
  .skills-grid,.contact-grid{grid-template-columns:1fr;gap:2.2rem}
  .services-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(26,26,26,.98);flex-direction:column;padding:1.4rem 2rem;gap:1.1rem;border-bottom:1px solid rgba(201,168,76,.15)}
  .nav-links.open{display:flex}
  .nav-toggle{display:flex}
}
@media(max-width:600px){
  .services-grid{grid-template-columns:1fr}
  .circles-grid{grid-template-columns:repeat(2,1fr)}
  .hero-actions{flex-direction:column}
  .section{padding:4rem 1.2rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

const HARD = [
  { name:"Social Media Management", pct:95, icon:"📱" },
  { name:"Strategy Development",    pct:87, icon:"📊" },
  { name:"Community Manager",       pct:80, icon:"🤝" },
  { name:"Content Planning",        pct:73, icon:"📝" },
  { name:"Digital Marketing",       pct:73, icon:"🎯" },
];
const SOFT = [
  { name:"Team Working",            pct:90, icon:"👥" },
  { name:"Time Management",         pct:90, icon:"⏰" },
  { name:"Communication",           pct:85, icon:"💬" },
  { name:"Problem Solving",         pct:85, icon:"🧩" },
  { name:"Planning & Organization", pct:80, icon:"🗂️" },
];
const SERVICES = [
  { icon:"📱", title:"Social Media Marketing",      desc:"Full-cycle social media management — from strategy to execution — that grows your brand presence and engagement." },
  { icon:"📋", title:"Marketing Strategy Planning", desc:"Tailored marketing strategies designed around your business goals, audience, and competitive landscape." },
  { icon:"🌐", title:"Digital Marketing",           desc:"End-to-end digital marketing solutions that drive traffic, leads, and measurable results online." },
  { icon:"📣", title:"Facebook & Instagram Ads",    desc:"Targeted paid ad campaigns on Meta platforms that maximize reach and return on ad spend." },
  { icon:"💡", title:"Marketing Consultation",      desc:"Expert guidance to help you navigate the ever-changing digital marketing landscape with confidence." },
  { icon:"🤝", title:"Community Building",          desc:"Building and nurturing engaged online communities that turn followers into loyal brand advocates." },
];
const CONTACT = [

/* ── hooks ── */
function useInView(ref, threshold=0.05) {
  const [v,setV] = useState(false);
  useEffect(()=>{
    const obs = new IntersectionObserver(([e])=>{ if(e.isIntersecting){setV(true);obs.disconnect();} },{threshold});
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);
  return v;
}

function useTypewriter(words, speed=75, pause=2000) {
  const [display,setDisplay] = useState('');
  const [wi,setWi] = useState(0);
  const [ci,setCi] = useState(0);
  const [del,setDel] = useState(false);
  useEffect(()=>{
    const cur = words[wi];
    let t;
    if(!del && ci<=cur.length){ t=setTimeout(()=>{ setDisplay(cur.slice(0,ci)); setCi(c=>c+1); },speed); }
    else if(!del && ci>cur.length){ t=setTimeout(()=>setDel(true),pause); }
    else if(del && ci>=0){ t=setTimeout(()=>{ setDisplay(cur.slice(0,ci)); setCi(c=>c-1); },speed/2); }
    else { setDel(false); setWi(i=>(i+1)%words.length); }
    return ()=>clearTimeout(t);
  },[ci,del,wi]);
  return display;
}

function useCounter(target, dur=1400, active=false) {
  const [n,setN] = useState(0);
  useEffect(()=>{
    if(!active) return;
    let s=0; const step=target/(dur/16);
    const id=setInterval(()=>{ s+=step; if(s>=target){setN(target);clearInterval(id);}else setN(Math.floor(s)); },16);
    return ()=>clearInterval(id);
  },[active,target]);
  return n;
}

/* ── Particles ── */
function Particles() {
  const ref = useRef(null);
  useEffect(()=>{
    // Skip particles on mobile/touch devices — too heavy
    if(window.innerWidth < 768 || ('ontouchstart' in window)) return;
    const c=ref.current, ctx=c.getContext('2d');
    let W=c.width=window.innerWidth, H=c.height=window.innerHeight;
    const pts = Array.from({length:45},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.8+0.4,
      dx:(Math.random()-.5)*.3, dy:(Math.random()-.5)*.3,
      a:Math.random()*.4+.1
    }));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(201,168,76,${p.a})`; ctx.fill();
        p.x+=p.dx; p.y+=p.dy;
        if(p.x<0||p.x>W) p.dx*=-1;
        if(p.y<0||p.y>H) p.dy*=-1;
      });
      for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
          ctx.strokeStyle=`rgba(201,168,76,${.05*(1-d/110)})`; ctx.lineWidth=.6; ctx.stroke(); }
      }
      raf=requestAnimationFrame(draw);
    };
    draw();
    const onR=()=>{ W=c.width=window.innerWidth; H=c.height=window.innerHeight; };
    window.addEventListener('resize',onR);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',onR); };
  },[]);
  return <canvas ref={ref} style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:0}}/>;
}

/* ── CircleSkill ── */
function CircleSkill({name,pct,icon,animate,delay=0}) {
  const r=36, circ=2*Math.PI*r;
  const offset = animate ? circ-(pct/100)*circ : circ;
  const n = useCounter(pct,1400,animate);
  return (
    <div className="circle-skill">
      <div className="circle-wrap">
        <svg viewBox="0 0 90 90">
          <circle className="c-bg" cx="45" cy="45" r={r}/>
          <circle className="c-fill" cx="45" cy="45" r={r}
            strokeDasharray={circ} strokeDashoffset={offset}
            style={{transition:`stroke-dashoffset 1.4s ${delay}ms cubic-bezier(.4,0,.2,1)`}}/>
        </svg>
        <div className="circle-pct">{animate?n:0}%</div>
      </div>
      <div className="circle-label">{icon} {name}</div>
    </div>
  );
}
